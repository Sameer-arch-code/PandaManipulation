version: "3.8"

services:
  gpu:
    build: .
    image: moveit2-humble-tutorial-custom
    container_name: moveit2_gpu
    privileged: true
    network_mode: host

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $XAUTHORITY:/root/.Xauthority
      - ../src:/root/ws_moveit/src

    environment:
      QT_X11_NO_MITSHM: 1
      DISPLAY: ${DISPLAY}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      ROS_DOMAIN_ID: 9
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp

    command: ["tail", "-f", "/dev/null"]
