version: "3.8"

services:
  gpu:
    build: .
    image: moveit2-humble-tutorial-custom
    container_name: moveit2_gpu
    privileged: true
    network_mode: host

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $XAUTHORITY:/root/.Xauthority
      - ../src:/root/ws_moveit/src

    environment:
      QT_X11_NO_MITSHM: 1
      DISPLAY: ${DISPLAY}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      ROS_DOMAIN_ID: 9
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp

    command:
    - /bin/bash
    - -c
    - |
        set -e

        # Build first (foreground)
        colcon build --packages-select sensor_massage

        # Source environment
        source install/setup.bash

        # Start nodes
        ros2 run imu_filter_madgwick imu_filter_madgwick_node \
          --ros-args \
          -p use_mag:=false \
          -p publish_tf:=true \
          -p remove_gravity_vector:=true &

        ros2 run sensor_massage massage_sensor &

        ros2 run imu_transformer imu_transformer_node \
          --ros-args \
          -p target_frame:=world \
          -r imu_in:=/imu/data &

        wait


